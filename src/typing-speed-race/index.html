<!DOCTYPE html>
<!-- Telegram: @Abolfazl_rwm -->
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Typing Speed Race — WPM test (FA/EN)</title>
<meta name="description" content="Measure typing speed and accuracy in Persian or English — live WPM chart, per-character feedback, results history. Offline single file.">
<style>
  :root { --bg:#0d1117; --panel:#161b22; --panel2:#1c2129; --border:#30363d;
          --text:#e6edf3; --muted:#8b949e; --accent:#59c2ff; --ok:#3fb950; --bad:#f85149; --cur:#ffb454; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font:15px/1.6 system-ui,-apple-system,"Segoe UI","Vazirmatn",sans-serif; min-height:100vh; }
  header { text-align:center; padding:22px 12px 6px; }
  header h1 { font-size:22px; } header h1 span { color:var(--accent); }
  header p { color:var(--muted); font-size:13px; margin-top:4px; }
  .wrap { max-width:820px; margin:0 auto; padding:12px 16px 44px; }
  .bar { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; align-items:center;
         background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:10px 12px; }
  .btn { background:var(--panel2); color:var(--text); border:1px solid var(--border); border-radius:8px;
         padding:7px 14px; font:inherit; cursor:pointer; }
  .btn:hover { border-color:#4d5d6f; }
  .btn.active { background:#1f6feb; border-color:#388bfd; }
  .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:14px; }
  .stat { background:var(--panel); border:1px solid var(--border); border-radius:12px; text-align:center; padding:12px 6px; }
  .stat b { font-size:26px; display:block; color:var(--accent); }
  .stat span { color:var(--muted); font-size:11.5px; text-transform:uppercase; letter-spacing:.5px; }
  .arena { margin-top:14px; background:var(--panel); border:1px solid var(--border); border-radius:12px;
           padding:18px 20px; font-size:19px; line-height:2.1; user-select:none; min-height:150px; }
  .arena.rtl { direction:rtl; text-align:right; font-size:20px; }
  .c { white-space:pre; border-radius:3px; padding:0 1px; }
  .c.todo { color:var(--muted); }
  .c.done { color:var(--ok); }
  .c.err { color:var(--bad); background:#f8514922; }
  .c.cursor { outline:2px solid var(--cur); animation:blink 1s steps(2) infinite; }
  @keyframes blink { 50% { outline-color:transparent; } }
  .ghost { color:transparent; }
  textarea { position:fixed; opacity:0; pointer-events:none; }
  .hint { color:var(--muted); font-size:12px; text-align:center; margin-top:8px; }
  canvas { width:100%; height:140px; margin-top:14px; background:var(--panel); border:1px solid var(--border); border-radius:12px; }
  table { width:100%; margin-top:14px; border-collapse:collapse; background:var(--panel); border:1px solid var(--border); border-radius:12px; overflow:hidden; }
  th, td { padding:7px 12px; text-align:center; border-bottom:1px solid var(--border); font-size:13px; }
  th { color:var(--muted); font-weight:600; background:var(--panel2); }
  footer { text-align:center; color:var(--muted); font-size:12px; padding:18px 0 10px; }
  footer a { color:var(--accent); text-decoration:none; }
</style>
</head>
<body>
<header>
  <h1>⌨️ Typing <span>Speed Race</span></h1>
  <p>میزان سرعت و دقت تایپ فارسی/انگلیسی — زنده، آفلاین، بدون ثبت‌نام</p>
</header>

<div class="wrap">
  <div class="bar">
    <button class="btn lang active" data-lang="fa">🇮🇷 فارسی</button>
    <button class="btn lang" data-lang="en">🇬🇧 English</button>
    <button class="btn dur" data-dur="30">30s</button>
    <button class="btn dur active" data-dur="60">60s</button>
    <button class="btn" id="restart">🔄 Restart</button>
  </div>

  <div class="stats">
    <div class="stat"><b id="wpm">0</b><span>WPM</span></div>
    <div class="stat"><b id="acc">100%</b><span>Accuracy</span></div>
    <div class="stat"><b id="chars">0</b><span>Chars</span></div>
    <div class="stat"><b id="time">60</b><span>Seconds</span></div>
  </div>

  <div class="arena rtl" id="arena" tabindex="0"></div>
  <div class="hint" id="hint">کلیک کن و تایپ را شروع کن — زمان با اولین حرف فعال می‌شود ⏱</div>
  <textarea id="capture" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>

  <canvas id="chart"></canvas>
  <table id="history"><thead><tr><th>#</th><th>WPM</th><th>Accuracy</th><th>Lang</th><th>Time</th></tr></thead><tbody></tbody></table>

  <footer>
    Built by <a href="https://t.me/Abolfazl_rwm" target="_blank" rel="noopener">Telegram: @Abolfazl_rwm</a> ·
    original practice sentences, runs fully offline
  </footer>
</div>

<script>
"use strict";
/* ---------------- original practice passages (no third-party text) ------ */
const TEXTS = {
  fa: [
    "زندگی کتابی است که هر روز یک صفحه تازه از آن ورق می‌خورد و قلم آن در دست خود ماست.",
    "از امروز شروع کن؛ مسیر هزار مایلی با قدم‌های کوچک اما پیوسته طی می‌شود نه با شتاب بی‌ثبات.",
    "کسی که امروز یک نفر را راهنمایی می‌کند، فردا خودش راهی بهتر پیدا می‌کند.",
    "کوچه‌های قدیمی شهر بوی خاطره می‌دهند و هر دیوار قصه‌ای برای خودش دارد.",
    "کتابخوانی گنجینه‌ای است که هزینه‌اش کم و سودش بی‌نهایت است.",
    "باران که می‌بارد کوچه‌ها آینه می‌شوند و شهر تصویر خود را در آب می‌بیند.",
    "کار گروهی آن‌جا جواب می‌دهد که هر عضو موفقیت تیم را موفقیت خود بداند.",
    "هنر مدیریت یعنی چیدن اولویت‌ها به‌شکلی که انرژی جایی هدر نرود.",
  ],
  en: [
    "Small daily improvements are the key to staggering long term results over time.",
    "The best way to predict the future is to build it with steady careful steps.",
    "Practice does not make perfect; only perfect practice makes perfect over the years.",
    "A calm mind brings inner strength and self confidence that is very healthy.",
    "Simplicity is the ultimate sophistication when design meets real needs.",
    "Great stories happen to those who can tell them in their own honest voice.",
    "Focus is about saying no to a hundred good ideas so one great one can live.",
    "Learning never exhausts the mind; it only ignites new curiosity in it.",
  ],
};

/* ---------------- state ---------------- */
let lang = "fa", duration = 60;
let target = "", typed = "";
let started = false, finished = false, startTs = 0, timerId = null;
let wpmSeries = [], results = JSON.parse(localStorage.getItem("tsr.results") || "[]");

const $ = id => document.getElementById(id);
const arena = $("arena"), capture = $("capture");

function normalize(ch) { return ch.replace("ي","ی").replace("ك","ک"); }
function pickText() {
  const arr = TEXTS[lang];
  return arr[Math.floor(Math.random() * arr.length)];
}
function reset() {
  target = pickText();
  typed = ""; started = false; finished = false; startTs = 0; wpmSeries = [];
  clearInterval(timerId); timerId = null;
  $("time").textContent = duration;
  $("wpm").textContent = "0"; $("acc").textContent = "100%"; $("chars").textContent = "0";
  arena.classList.toggle("rtl", lang === "fa");
  arena.dir = lang === "fa" ? "rtl" : "ltr";
  render(); drawChart(); renderHistory();
  $("hint").textContent = lang === "fa"
    ? "کلیک کن و تایپ را شروع کن — زمان با اولین حرف فعال می‌شود ⏱"
    : "Click here and start typing — the timer starts on your first key ⏱";
}

/* ---------------- rendering ---------------- */
function render() {
  let html = "";
  for (let i = 0; i < target.length; i++) {
    let cls = "c ";
    if (i < typed.length) cls += typed[i] === target[i] ? "done" : "err";
    else if (i === typed.length) cls += "cursor";
    else cls += "todo";
    html += `<span class="${cls}">${escapeHtml(target[i])}</span>`;
  }
  if (typed.length >= target.length) html += `<span class="c cursor ghost"> </span>`;
  arena.innerHTML = html;
}
function escapeHtml(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\n/g," ");
}

/* ---------------- timing & metrics ---------------- */
function start() {
  started = true; startTs = performance.now();
  timerId = setInterval(tick, 200);
}
function elapsed() { return (performance.now() - startTs) / 1000; }
function tick() {
  const left = Math.max(0, duration - elapsed());
  $("time").textContent = Math.ceil(left);
  const secs = elapsed();
  const wpm = computeWpm(secs);
  $("wpm").textContent = wpm;
  wpmSeries.push(wpm); drawChart();
  if (left <= 0) finish();
}
function computeWpm(secs) {
  const correct = countCorrect();
  return Math.round((correct / 5) / (Math.max(secs, 1) / 60));
}
function countCorrect() {
  let n = 0;
  for (let i = 0; i < typed.length; i++) if (typed[i] === target[i]) n++;
  return n;
}
function updateLive() {
  $("chars").textContent = typed.length;
  const correct = countCorrect();
  $("acc").textContent = typed.length ? Math.round(100 * correct / typed.length) + "%" : "100%";
}

function finish() {
  if (finished) return;
  finished = true; clearInterval(timerId);
  const secs = Math.max(1, Math.min(duration, elapsed()));
  const correct = countCorrect();
  const wpm = Math.round((correct / 5) / (secs / 60));
  const acc = typed.length ? Math.round(100 * correct / typed.length) : 0;
  $("wpm").textContent = wpm; $("acc").textContent = acc + "%";
  results.unshift({ wpm, acc, lang, dur: duration, at: new Date().toLocaleTimeString() });
  results = results.slice(0, 8);
  localStorage.setItem("tsr.results", JSON.stringify(results));
  renderHistory();
  arena.innerHTML = `<div style="text-align:center;font-size:22px">🏁 <b>${wpm} WPM</b> · ${acc}% — <span style="color:var(--muted);font-size:14px">${lang==="fa"?"دوباره تلاش کن!":"try again!"}</span></div>`;
}

/* ---------------- input handling ---------------- */
arena.addEventListener("click", () => capture.focus());
capture.addEventListener("input", e => {
  if (finished) { capture.value = ""; return; }
  if (!started) start();
  typed = e.target.value.replace(/\n/g, "");
  render(); updateLive();
  if (typed.length >= target.length) finish();
});
capture.addEventListener("keydown", e => {
  if (e.key === "Tab") { e.preventDefault(); reset(); capture.focus(); }
});

/* ---------------- chart (hand-drawn, no libs) ---------------- */
function drawChart() {
  const cv = $("chart"), ctx = cv.getContext("2d");
  cv.width = cv.clientWidth * 2; cv.height = 280;
  ctx.scale(2, 2);
  const W = cv.clientWidth, H = 140;
  ctx.clearRect(0, 0, W, H);
  ctx.strokeStyle = "#30363d"; ctx.lineWidth = 1;
  for (let y = 1; y < 4; y++) { ctx.beginPath(); ctx.moveTo(0, H*y/4); ctx.lineTo(W, H*y/4); ctx.stroke(); }
  if (wpmSeries.length < 2) {
    ctx.fillStyle = "#8b949e"; ctx.font = "12px system-ui";
    ctx.fillText(lang === "fa" ? "نمودار سرعت پس از شروع تایپ…" : "speed curve appears once you type…", 12, 22);
    return;
  }
  const max = Math.max(40, ...wpmSeries) * 1.1;
  ctx.strokeStyle = "#59c2ff"; ctx.lineWidth = 2; ctx.beginPath();
  wpmSeries.forEach((v, i) => {
    const x = i / (wpmSeries.length - 1) * (W - 16) + 8;
    const y = H - (v / max) * (H - 14) - 6;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  });
  ctx.stroke();
  ctx.fillStyle = "#59c2ff"; ctx.font = "11px system-ui";
  ctx.fillText("max " + Math.round(Math.max(...wpmSeries)), 8, 12);
}

/* ---------------- history ---------------- */
function renderHistory() {
  const tb = $("history").querySelector("tbody");
  tb.innerHTML = results.map((r, i) =>
    `<tr><td>${i+1}</td><td><b>${r.wpm}</b></td><td>${r.acc}%</td><td>${r.lang==="fa"?"FA":"EN"}</td><td>${r.dur}s</td></tr>`
  ).join("") || `<tr><td colspan="5" style="color:var(--muted)">— no runs yet —</td></tr>`;
}

/* ---------------- controls ---------------- */
document.querySelectorAll(".lang").forEach(b => b.onclick = () => {
  document.querySelectorAll(".lang").forEach(x => x.classList.remove("active"));
  b.classList.add("active"); lang = b.dataset.lang; reset();
});
document.querySelectorAll(".dur").forEach(b => b.onclick = () => {
  document.querySelectorAll(".dur").forEach(x => x.classList.remove("active"));
  b.classList.add("active"); duration = +b.dataset.dur; reset();
});
$("restart").onclick = () => { reset(); capture.focus(); };
window.addEventListener("resize", drawChart);

reset();
</script>
</body>
</html>
