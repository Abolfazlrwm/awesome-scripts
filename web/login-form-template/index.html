<!DOCTYPE html>
   <html lang="fa" dir="rtl">
   <head>

      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">

      <!--=============== REMIXICONS ===============-->
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/3.5.0/remixicon.css" crossorigin="">

      <!--=============== CSS ===============-->
      <link rel="stylesheet" href="assets/css/styles.css">

      <title>صفحه ورود</title>
   </head>
   <body>
      <div class="login">
         <img src="assets/img/login-bg.png" alt="image" class="login__bg">

         <form action="" class="login__form">
            <h1 class="login__title">صفحه ورود</h1>

            <div class="login__inputs">
               <div class="login__box">
                  <input type="email" placeholder="ایمیل" required class="login__input">
                  <i class="ri-mail-fill"></i>
               </div>

               <div class="login__box">
                  <input type="password" placeholder="پسورد" required class="login__input">
                  <i class="ri-lock-2-fill"></i>
               </div>
            </div>

            <div class="login__check">
               <div class="login__check-box">
                  <input type="checkbox" class="login__check-input" id="user-check">
                  <label for="user-check" class="login__check-label">منو به خاطر بسپار</label>
               </div>

               <a href="#" class="login__forgot">پسوردتو فراموش کردی؟!</a>
            </div>

            <button type="submit" class="login__button">ورود</button>

            <div class="login__register">
               اکانت نداری؟! <a href="#">همین الان یکی بساز</a>
            </div>
         </form>
      </div>
   </body>
</html>
