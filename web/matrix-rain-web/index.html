<!DOCTYPE html>
<!-- Telegram: @Abolfazl_rwm -->
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matrix Rain — بارش ماتریکس</title>
<meta name="description" content="بارش نئونی ماتریکس با گلیف‌های کاتاکانا/باینری/فارسی و حالت پیام — متن تو در باران ظاهر می‌شود — کاملاً آفلاین.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;800;900&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0a0a16; --glass:rgba(148,163,184,.06); --glass2:rgba(148,163,184,.11);
    --border:rgba(148,163,184,.16); --border2:rgba(74,222,128,.4);
    --text:#eef2fc; --muted:#8f9ab8;
    --a1:#4ade80; --a2:#22d3ee;
    --r:18px;
    --font-fa:'Vazirmatn',system-ui,sans-serif; --font-en:'Outfit','Vazirmatn',system-ui,sans-serif;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    background:
      radial-gradient(1000px 520px at 88% -10%, rgba(74,222,128,.10), transparent 60%),
      radial-gradient(900px 520px at -8% 108%, rgba(34,211,238,.10), transparent 60%),
      var(--bg);
    color:var(--text); font:15.5px/1.7 var(--font-fa); min-height:100vh; overflow-x:hidden;
  }
  body::before {
    content:""; position:fixed; inset:0; pointer-events:none; opacity:.4;
    background-image:linear-gradient(var(--border) 1px, transparent 1px),
                     linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size:44px 44px;
    mask-image:radial-gradient(ellipse 90% 70% at 50% 0%, black 30%, transparent 75%);
  }
  header { text-align:center; padding:22px 14px 4px; }
  .logo { font-size:42px; filter:drop-shadow(0 6px 18px rgba(74,222,128,.5)); }
  h1 { font:800 30px/1.2 var(--font-fa); margin-top:6px;
       background:linear-gradient(90deg, var(--a1), var(--a2));
       -webkit-background-clip:text; background-clip:text; color:transparent; }
  header p { color:var(--muted); font-size:13.5px; margin-top:4px; }
  .wrap { max-width:960px; margin:0 auto; padding:12px 18px 44px; position:relative; }
  .glass { background:var(--glass); border:1px solid var(--border); border-radius:var(--r);
           backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }
  .stage { position:relative; margin-top:14px; overflow:hidden; border-radius:14px;
           border:1px solid var(--border2); background:#01040a;
           box-shadow:0 0 44px -10px rgba(74,222,128,.4); }
  canvas { display:block; width:100%; height:auto; }
  .card { padding:14px 16px; margin-top:13px; }
  .card h3 { font-size:13.5px; color:var(--muted); font-weight:700; margin-bottom:10px; }
  .row { display:flex; align-items:center; gap:12px; margin-top:8px; flex-wrap:wrap; }
  .row label { font-size:13px; color:var(--muted); min-width:86px; }
  .row input[type=range] { flex:1; accent-color:var(--a1); min-width:130px; }
  .val { font:800 13px var(--font-en); color:var(--a1); min-width:40px; text-align:center; }
  input[type=text] { flex:1; min-width:200px; background:var(--glass2); border:1px solid var(--border);
                     border-radius:11px; color:var(--text); font:600 14px var(--font-fa); padding:9px 14px; outline:none; }
  input[type=text]:focus { border-color:var(--a1); }
  .btn { background:var(--glass2); color:var(--text); border:1px solid var(--border); border-radius:11px;
         padding:8px 16px; font:600 13.5px var(--font-fa); cursor:pointer; transition:.18s; }
  .btn:hover { border-color:var(--border2); transform:translateY(-1px); }
  .btn.primary { background:linear-gradient(135deg, var(--a1), var(--a2)); border-color:transparent;
                 color:#04160a; font-weight:800; }
  select { background:var(--glass2); border:1px solid var(--border); border-radius:11px; color:var(--text);
           font:600 13px var(--font-fa); padding:8px 12px; outline:none; }
  input[type=color] { width:38px; height:32px; border:1px solid var(--border); border-radius:9px;
                      background:var(--glass2); cursor:pointer; padding:2px; }
  footer { text-align:center; color:var(--muted); font-size:12.5px; margin-top:16px; }
  footer a { color:var(--a1); text-decoration:none; font-weight:700; }
</style>
</head>
<body>
<header>
  <div class="logo">🌧️</div>
  <h1>بارش ماتریکس</h1>
  <p>باران نئونی گلیف‌ها — و حالت ویژه‌ی «پیام»: متن تو در دل باران ظاهر می‌شود، مثل فیلم</p>
</header>

<div class="wrap">
  <div class="stage"><canvas id="cv" width="920" height="520" aria-label="بارش"></canvas></div>

  <div class="glass card">
    <h3>💬 حالت پیام — متن را بنویس و در باران ظاهرش کن</h3>
    <div class="row">
      <input type="text" id="msg" maxlength="60" value="سلام دنیا!" placeholder="متن پیام…">
      <button class="btn primary" id="reveal">✨ نمایان شو</button>
    </div>
  </div>

  <div class="glass card">
    <h3>🎛 تنظیمات بارش</h3>
    <div class="row">
      <label>گلیف‌ها</label>
      <select id="glyphs">
        <option value="katakana" selected>カタカナ کاتاکانا</option>
        <option value="binary">۰۱ باینری</option>
        <option value="hex">0–F هگز</option>
        <option value="persian">فارسی</option>
      </select>
      <label style="min-width:auto">رنگ</label>
      <input type="color" id="color" value="#4ade80">
      <input type="color" id="color2" value="#22d3ee" title="رنگ دوم (تغییر تدریجی)">
    </div>
    <div class="row">
      <label>سرعت</label>
      <input type="range" id="speed" min="2" max="30" value="12">
      <span class="val" id="spdV">12</span>
      <label style="min-width:auto">تراکم</label>
      <input type="range" id="density" min="30" max="100" value="85">
      <span class="val" id="denV">85%</span>
    </div>
    <div class="row">
      <button class="btn" id="shot">💾 ذخیره PNG</button>
      <button class="btn" id="reset">↺ ریست بارش</button>
    </div>
  </div>

  <footer>
    ساخته‌شده توسط <a href="https://t.me/Abolfazl_rwm" target="_blank" rel="noopener">Telegram: @Abolfazl_rwm</a> ·
    Canvas خالص بدون کتابخانه · کاملاً آفلاین
  </footer>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d");
const W = cv.width, H = cv.height;
const FS = 16, COLSN = Math.floor(W / FS), ROWSN = Math.ceil(H / FS);

const SETS = {
  katakana: "アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワン0123456789",
  binary: "01",
  hex: "0123456789ABCDEF",
  persian: "ابپتثجچحخدذرزژسشصضطظعغفقکگلمنوهی۰۱۲۳۴۵۶۷۸۹",
};
let set = SETS.katakana;
let speed = 12, density = 0.85;
let c1 = "#4ade80", c2 = "#22d3ee";
let cols = [];
let lit = [];            /* revealed message cells {x, y, ch, t0} */
let revealing = false, fadeStart = 0, msgTargets = [];
let last = 0;

function reset() {
  cols = Array.from({ length: COLSN }, () => ({
    y: Math.random() * ROWSN * -1,
    v: 0.7 + Math.random() * 1.6,     /* rows/sec multiplier */
    on: Math.random() < density,
    litIdx: 0,
  }));
  lit = [];
  ctx.fillStyle = "#01040a";
  ctx.fillRect(0, 0, W, H);
}
const rnd = s => s[Math.floor(Math.random() * s.length)];

/* build message target cells from an offscreen bitmap */
function buildTargets(text) {
  const off = document.createElement("canvas");
  off.width = W; off.height = H;
  const o = off.getContext("2d");
  o.fillStyle = "#fff";
  o.textAlign = "center"; o.textBaseline = "middle";
  let size = 72;
  o.font = `800 ${size}px Vazirmatn, Outfit, sans-serif`;
  while (o.measureText(text).width > W * 0.86 && size > 22) {
    size -= 6;
    o.font = `800 ${size}px Vazirmatn, Outfit, sans-serif`;
  }
  o.fillText(text, W / 2, H / 2);
  const data = o.getImageData(0, 0, W, H).data;
  const targets = [];
  for (let r = 0; r < ROWSN; r++)
    for (let c = 0; c < COLSN; c++) {
      const px = Math.floor(c * FS + FS / 2), py = Math.floor(r * FS + FS / 2);
      if (data[(py * W + px) * 4 + 3] > 110) targets.push({ c, r });
    }
  return targets;
}
$("reveal").onclick = () => {
  const text = $("msg").value.trim();
  if (!text) return;
  msgTargets = buildTargets(text);
  msgTargets.sort((a, b) => a.r - b.r || a.c - b.c);
  /* group by column so each column reveals top-down */
  const byCol = new Map();
  msgTargets.forEach(t => {
    if (!byCol.has(t.c)) byCol.set(t.c, []);
    byCol.get(t.c).push(t.r);
  });
  cols.forEach((col, i) => { col.targets = byCol.get(i) || null; col.litIdx = 0; });
  lit = [];
  revealing = true; fadeStart = 0;
  cols.forEach(col => { if (col.y > 0) col.y = Math.min(col.y, -Math.random() * 6); });
};
$("reset").onclick = () => { revealing = false; reset(); };
$("glyphs").onchange = e => { set = SETS[e.target.value]; };
$("speed").oninput = e => { speed = +e.target.value; $("spdV").textContent = speed; };
$("density").oninput = e => { density = +e.target.value / 100; $("denV").textContent = e.target.value + "%"; };
$("color").oninput = e => { c1 = e.target.value; };
$("color2").oninput = e => { c2 = e.target.value; };
$("shot").onclick = () => {
  const a = document.createElement("a");
  a.download = "matrix-rain.png";
  a.href = cv.toDataURL("image/png");
  a.click();
};

function lerpColor(k) {   /* mix c1 -> c2 along the column depth */
  const p = (h) => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
  const [r1, g1, b1] = p(c1), [r2, g2, b2] = p(c2);
  return `rgb(${Math.round(r1+(r2-r1)*k)},${Math.round(g1+(g2-g1)*k)},${Math.round(b1+(b2-b1)*k)})`;
}

function frame(t) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (t - last) / 1000);
  last = t;
  /* fading trail */
  ctx.fillStyle = "rgba(1,4,10,.10)";
  ctx.fillRect(0, 0, W, H);
  ctx.font = `${FS - 2}px Vazirmatn, Outfit, monospace`;
  ctx.textAlign = "center";
  for (let i = 0; i < COLSN; i++) {
    const col = cols[i];
    if (!col.on) continue;
    col.y += speed * col.v * dt;
    const x = i * FS + FS / 2;
    /* message reveal: light up when head passes the target row */
    if (revealing && col.targets && col.litIdx < col.targets.length) {
      while (col.litIdx < col.targets.length && Math.floor(col.y) >= col.targets[col.litIdx]) {
        lit.push({ x, r: col.targets[col.litIdx], ch: rnd(set), t0: t, c: i });
        col.litIdx++;
      }
    }
    /* head glyph */
    if (col.y > 0) {
      const y = Math.floor(col.y) * FS;
      const k = Math.min(1, Math.floor(col.y) / ROWSN);
      ctx.save();
      ctx.shadowColor = lerpColor(k);
      ctx.shadowBlur = 10;
      ctx.fillStyle = "#eafff2";
      ctx.fillText(rnd(set), x, y);
      ctx.restore();
      /* echo glyph behind */
      ctx.fillStyle = lerpColor(k);
      ctx.globalAlpha = 0.7;
      ctx.fillText(rnd(set), x, y - FS);
      ctx.globalAlpha = 1;
    }
    if (col.y > ROWSN + 3) {
      col.y = -Math.random() * 8;
      col.v = 0.7 + Math.random() * 1.6;
    }
  }
  /* lit message glyphs */
  if (revealing) {
    if (!fadeStart) {
      const allDone = cols.every(c2 => !c2.targets || c2.litIdx >= c2.targets.length);
      if (allDone && lit.length) fadeStart = t + 3800;
      if (!msgTargets.length) fadeStart = t + 100;
    }
    const fadeK = fadeStart ? Math.max(0, Math.min(1, (fadeStart + 1400 - t) / 1400)) : 1;
    ctx.save();
    ctx.shadowColor = "#ffffff";
    ctx.shadowBlur = 14;
    for (const L of lit) {
      const y = L.r * FS;
      ctx.globalAlpha = fadeK;
      ctx.fillStyle = "#f6fffb";
      ctx.font = `700 ${FS - 2}px Vazirmatn, Outfit, monospace`;
      ctx.fillText(L.ch, L.x, y);
    }
    ctx.restore();
    ctx.globalAlpha = 1;
    if (fadeStart && t > fadeStart + 1400) { revealing = false; cols.forEach(c2 => c2.targets = null); }
  }
}
reset();
requestAnimationFrame(frame);
</script>
</body>
</html>
