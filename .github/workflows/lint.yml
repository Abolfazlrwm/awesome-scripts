name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-syntax:
    name: Python syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile-check all .py files
        run: |
          set -e
          files=$(find . -name "*.py" -not -path "*/node_modules/*")
          if [ -z "$files" ]; then
            echo "No Python files found."
            exit 0
          fi
          echo "$files" | xargs -I{} python -m py_compile {}
          echo "All Python files compiled successfully."

  node-syntax:
    name: Node.js syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax-check all .js files
        run: |
          set -e
          files=$(find . -name "*.js" -not -path "*/node_modules/*")
          if [ -z "$files" ]; then
            echo "No JavaScript files found."
            exit 0
          fi
          for f in $files; do
            node --check "$f"
          done
          echo "All JavaScript files passed syntax check."

  php-syntax:
    name: PHP syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Lint all .php files
        run: |
          set -e
          files=$(find . -name "*.php" -not -path "*/node_modules/*" -not -path "*/vendor/*")
          if [ -z "$files" ]; then
            echo "No PHP files found."
            exit 0
          fi
          for f in $files; do
            php -l "$f"
          done
          echo "All PHP files passed syntax check."
